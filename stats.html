h1 { font-size: 1.85rem; font-weight: 700; margin: 1.5rem 0 0.25rem; letter-spacing: -0.01em; }

dl { display: grid; grid-template-columns: repeat(auto-fit, minmax(12.5rem, 1fr)); gap: 1rem; margin: 1.35rem 0; }
dl > div { background: var(--surface); border: 1px solid var(--line); border-radius: 0.75rem; padding: 1.05rem 1.25rem; display: flex; align-items: center; gap: 1rem; box-shadow: 0 2px 5px rgba(15,23,42,.03); transition: transform .15s, box-shadow .15s; }

dt { color: var(--muted); font-size: .84rem; font-weight: 500; }

.toolbar { display: flex; justify-content: space-between; align-items: flex-end; gap: 1rem; flex-wrap: wrap; border-bottom: 1px solid var(--line); margin-bottom: 0.85rem; }

.tabs button { background: none; border: 0; border-bottom: 3px solid transparent; color: var(--muted); font: inherit; font-size: 1rem; font-weight: 500; padding: 0.6rem 0.15rem; margin-bottom: -1px; cursor: pointer; white-space: nowrap; transition: color .15s, border-color .15s; }
.tabs button:hover { color: var(--text); }
.tabs button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); font-weight: 600; }
.search-input { width: 17rem; max-width: 100%; font: inherit; font-size: .95rem; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 0.5rem; padding: 0.5rem 0.85rem; margin-bottom: 0.55rem; }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 600; font-size: .82rem; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 0.65rem 0.75rem; border-bottom: 1px solid var(--line); }
td { padding: 0.75rem 0.75rem; border-bottom: 1px solid var(--line); font-size: 1.02rem; vertical-align: middle; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr:hover { background: var(--bg); }
.num { text-align: right; white-space: nowrap; font-weight: 600; }
th.num { text-align: right; }

.link, .plink { background: none; border: 0; padding: 0.15rem 0; font: inherit; font-weight: 500; cursor: pointer; text-align: left; display: inline-flex; align-items: center; }
.link { color: var(--accent); gap: 0.7rem; }

.plink { color: var(--text); gap: 0.55rem; }
.plink:hover { color: var(--accent); }
.lead-cell { display: inline-flex; align-items: center; gap: 0.6rem; }
.lead-val { color: var(--muted); font-size: .88rem; font-weight: 400; }

@keyframes fadeInRows { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }

dialog { width: min(48rem, calc(100vw - 2rem)); max-height: 86vh; overflow: auto; background: var(--surface); color: var(--text); border: 1px solid var(--line); border-radius: 0.9rem; padding: 1.5rem 1.75rem; box-shadow: 0 24px 54px rgba(15,23,42,.18); }

.dh { display: flex; justify-content: space-between; gap: 1rem; align-items: center; position: sticky; top: -1.5rem; background: var(--surface); padding: 0.25rem 0 0.9rem; border-bottom: 1px solid var(--line); z-index: 2; }

.pod-bar { width: 100%; border-radius: 0.5rem 0.5rem 0 0; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.1rem; border: 1px solid transparent; border-bottom: 0; }

.rank-badge { display: inline-block; min-width: 2.4rem; text-align: center; font-size: .85rem; font-weight: 700; padding: 0.2rem 0.55rem; border-radius: 1rem; background: var(--soft); color: var(--muted); }
.rank-1 { background: var(--gold-bg); color: var(--gold); }
.rank-2 { background: var(--silver-bg); color: var(--silver); }
.rank-3 { background: var(--bronze-bg); color: var(--bronze); }
.share { display: inline-block; width: 5.5rem; height: 0.45rem; border-radius: 0.25rem; overflow: hidden; background: var(--soft); vertical-align: middle; margin-left: 0.6rem; }

@media (max-width: 720px) {

function toTC(id){return id.split("_").map(function(w){return w?w.charAt(0).toUpperCase()+w.slice(1):""}).join("_")}
function toPC(id){return id.split("_").map(function(w){return w?w.charAt(0).toUpperCase()+w.slice(1):""}).join("")}

function getIconCandidates(k, c){
  var id = k.replace(/^minecraft:/, "");
  if(c === "custom"){
    var cf = CUSTOM_ICONS[k] || CUSTOM_ICONS["minecraft:" + id];
    if(cf){
      var l = [WIKI_FP + cf];
      if(/Face\.png$/.test(cf)) l.push(WIKI_FP + cf.replace(/([a-z])([A-Z])/g, "$1_$2"));
      return l;
    }
    return [WIKI_FP + "Invicon_" + toTC(id) + ".png"];
  }
  if(c === "killed" || c === "killed_by"){
    if(id === "player") return [WIKI_FP + "AlexFace.png", WIKI_FP + "Alex_Face.png"];
    var pc = toPC(id), tc = toTC(id);
    return [WIKI_FP + pc + "Face.png", WIKI_FP + tc + "_Face.png", WIKI_FP + "Invicon_" + tc + "_Spawn_Egg.png", WIKI_FP + "Invicon_" + tc + ".png"];
  }
  var norm = id.replace(/^waxed_/, "").replace(/_wall_hanging_sign$/, "_hanging_sign").replace(/_wall_sign$/, "_sign")
               .replace(/_wall_banner$/, "_banner").replace(/_wall_head$/, "_head").replace(/_wall_skull$/, "_skull")
               .replace(/_wall_torch$/, "_torch").replace(/_wall_fan$/, "_fan").replace(/^wall_torch$/, "torch")
               .replace(/_candle_cake$/, "_candle").replace(/^potted_/, "");
  var u = [];
  if(ITEM_NAME_MAP[norm]) u.push(WIKI_FP + "Invicon_" + ITEM_NAME_MAP[norm] + ".png");
  if(/_armor_trim_smithing_template$/.test(norm)) u.push(WIKI_FP + "Invicon_" + toTC(norm.replace(/_smithing_template$/, "")) + ".png");
  if(/_banner_pattern$/.test(norm)) u.push(WIKI_FP + "Invicon_Banner_Pattern.png");
  var t = toTC(norm);
  u.push(WIKI_FP + "Invicon_" + t + ".png");
  var lp = t.replace(/_Of_/g, "_of_").replace(/_The_/g, "_the_").replace(/_On_/g, "_on_").replace(/_A_/g, "_a_").replace(/_With_/g, "_with_");
  if(lp !== t) u.push(WIKI_FP + "Invicon_" + lp + ".png");
  if(/_block$/.test(norm)) u.push(WIKI_FP + "Invicon_Block_of_" + toTC(norm.replace(/_block$/, "")) + ".png");
  u.push(WIKI_FP + t + ".png");
  return u;
}

window.icoErr = function(img){
  var l = (img.getAttribute("data-fb") || "").split("|").filter(Boolean);
  var i = parseInt(img.getAttribute("data-idx") || "0", 10) + 1;
  if(i < l.length){ img.setAttribute("data-idx", String(i)); img.src = l[i]; }
  else { img.style.display = "none"; }
};

function iconHtml(k, c){
  var u = getIconCandidates(k, c);
  return u.length ? "<img class=\"ico\" src=\"" + esc(u[0]) + "\" data-fb=\"" + esc(u.join("|")) + "\" data-idx=\"0\" alt=\"\" loading=\"lazy\" onerror=\"icoErr(this)\">" : "";
}
function headHtml(name){
  var u = encodeURIComponent(name);
  var fb = ["https://mc-heads.net/avatar/" + u + "/64", "https://minotar.net/helm/" + u + "/64.png", WIKI_FP + "AlexFace.png"];
  return "<img class=\"head\" src=\"" + esc(fb[0]) + "\" data-fb=\"" + esc(fb.join("|")) + "\" data-idx=\"0\" alt=\"\" loading=\"lazy\" onerror=\"icoErr(this)\">";
}

var data=DEMO,demo=true,cat="custom",q="",open=null,openPlayer=null,pcat="custom",pq="";
var $=function(s){return document.querySelector(s)};
function esc(s){var d=document.createElement("div");d.textContent=String(s);return d.innerHTML}
function nf(v,d){return Number(v||0).toLocaleString("de",{maximumFractionDigits:d||0})}
function label(k){return L[k]||k.replace("minecraft:","").replace(/_/g," ").replace(/^./,function(c){return c.toUpperCase()})}
function fmt(k,v,c){
  if(c==="custom"){
    if(/_one_cm$/.test(k)){var m=v/100;return m>=1000?nf(m/1000,1)+" km":nf(m)+" m"}
    if(/play_time|play_one_minute|sneak_time|total_world_time/.test(k))return nf(v/72000,1)+" h";
  }
  return nf(v);
}
function sumC(c,f){var o=(data.c||{})[c]||{},s=0;Object.keys(o).forEach(function(k){if(!f||f(k))s+=(o[k]&&o[k].t)||0});return s}
function entries(c){var o=(data.c||{})[c]||{};return Object.keys(o).filter(function(k){return !/time_since_/.test(k)}).map(function(k){return [k,o[k]]})}

function allPlayers(){
  var map={};
  Object.keys(data.c||{}).forEach(function(c){
    var o=data.c[c]||{};
    Object.keys(o).forEach(function(k){
      ((o[k]||{}).p||[]).forEach(function(r){ if(r&&r[0]) map[r[0]]=true; });
    });
  });
  return Object.keys(map).sort(function(a,b){return a.localeCompare(b,"de")});
}

function renderTot(){
  var t=[
    ["Spielzeit",nf(sumC("custom",function(k){return /play_time|play_one_minute/.test(k)})/72000,1)+" h","minecraft:play_time","custom"],
    ["Strecke",nf(sumC("custom",function(k){return /_one_cm$/.test(k)})/100000,1)+" km","minecraft:walk_one_cm","custom"],
    ["Blöcke abgebaut",nf(sumC("mined")),"minecraft:diamond_pickaxe","used"],
    ["Mobs getötet",nf(sumC("custom",function(k){return /mob_kills/.test(k)})),"minecraft:mob_kills","custom"],
    ["Tode",nf(sumC("custom",function(k){return /:deaths$/.test(k)})),"minecraft:deaths","custom"]
  ];
  $("#tot").innerHTML=t.map(function(x){
    return "<div><div class=\"tot-ico\">"+iconHtml(x[2],x[3])+"</div><div><dt>"+esc(x[0])+"</dt><dd>"+esc(x[1])+"</dd></div></div>";
  }).join("");
}

function renderPlayersBar(){
  var ps=allPlayers();
  $("#pbar").innerHTML=ps.length?"<span class=\"lbl\">Spieler ("+ps.length+"):</span>"+ps.map(function(n){
    return "<button type=\"button\" class=\"p-chip\" data-p=\""+esc(n)+"\">"+headHtml(n)+"<span>"+esc(n)+"</span></button>";
  }).join(""):"";
}

function renderTabs(){
  $("#tabs").innerHTML=CATS.filter(function(c){return (data.c||{})[c[0]]}).map(function(c){
    return "<button type=\"button\" data-c=\""+c[0]+"\" aria-pressed=\""+(c[0]===cat)+"\">"+esc(c[1])+"</button>";
  }).join("");
}

function renderList(){
  var es=entries(cat).filter(function(e){return label(e[0]).toLowerCase().indexOf(q.toLowerCase())>-1}).sort(function(a,b){return b[1].t-a[1].t});
  $("#list").innerHTML=es.length?es.map(function(e){
    var top=e[1].p&&e[1].p[0];
    var lead=top?"<div class=\"lead-cell\"><button type=\"button\" class=\"plink\" data-p=\""+esc(top[0])+"\">"+headHtml(top[0])+"<span>"+esc(top[0])+"</span></button><span class=\"lead-val\">("+esc(fmt(e[0],top[1],cat))+")</span></div>":"–";
    return "<tr><td><button class=\"link\" type=\"button\" data-k=\""+esc(e[0])+"\">"+iconHtml(e[0],cat)+"<span>"+esc(label(e[0]))+"</span></button></td><td class=\"col-lead\">"+lead+"</td><td class=\"num\">"+esc(fmt(e[0],e[1].t,cat))+"</td></tr>";
  }).join(""):"<tr><td colspan=\"3\" class=\"empty\">Nichts gefunden.</td></tr>";
}

function renderPodium(pList, k, c){
  var pod=$("#podium");
  if(!pList||!pList.length){pod.style.display="none";pod.innerHTML="";return}
  pod.style.display="grid";
  pod.innerHTML=[1,0,2].map(function(idx){
    var it=pList[idx], r=idx+1;
    if(!it) return "<div class=\"pod-slot pod-"+r+"\"></div>";
    return "<div class=\"pod-slot pod-"+r+"\"><button type=\"button\" class=\"pod-player\" data-p=\""+esc(it[0])+"\">"+headHtml(it[0])+"<span class=\"pod-name\">"+esc(it[0])+"</span></button><span class=\"pod-val\">"+esc(fmt(k,it[1],c))+"</span><div class=\"pod-bar\">"+r+".</div></div>";
  }).join("");
}

function renderDlg(){
  if(!open)return;
  var e=((data.c||{})[open.c]||{})[open.k];if(!e)return;
  $("#dt").innerHTML=iconHtml(open.k,open.c)+"<span>"+esc(label(open.k))+"</span>";
  $("#ds").textContent="Gesamt "+fmt(open.k,e.t,open.c)+" • "+e.p.length+" Spieler";
  renderPodium(e.p, open.k, open.c);
  $("#db").innerHTML=e.p.map(function(p,i){
    var s=e.t?(p[1]/e.t*100):0;
    return "<tr><td>"+(i+1)+".</td><td><button type=\"button\" class=\"plink\" data-p=\""+esc(p[0])+"\">"+headHtml(p[0])+"<span>"+esc(p[0])+"</span></button></td><td class=\"num\">"+esc(fmt(open.k,p[1],open.c))+"</td><td class=\"num\">"+nf(s,1)+" %<span class=\"share\"><i style=\"width:"+s+"%\"></i></span></td></tr>";
  }).join("");
}

function getPlayerStats(pName, cKey){
  var o=(data.c||{})[cKey]||{}, res=[];
  Object.keys(o).filter(function(k){return !/time_since_/.test(k)}).forEach(function(k){
    var pl=(o[k]||{}).p||[];
    for(var i=0;i<pl.length;i++){
      if(pl[i][0]===pName){ res.push({k:k,c:cKey,val:pl[i][1],rank:i+1,tot:pl.length}); break; }
    }
  });
  return res;
}

function renderPlayerDlg(){
  if(!openPlayer)return;
  var av=CATS.filter(function(c){return getPlayerStats(openPlayer,c[0]).length>0});
  if(av.length&&!av.some(function(c){return c[0]===pcat})) pcat=av[0][0];
  $("#pdt").innerHTML=headHtml(openPlayer)+"<span>"+esc(openPlayer)+"</span>";
  var totE=0, top1=0;
  CATS.forEach(function(c){ getPlayerStats(openPlayer,c[0]).forEach(function(s){ totE++; if(s.rank===1) top1++; }); });
  $("#pds").textContent=totE+" Statistiken erfasst • "+top1+"× Platz 1";
  $("#ptabs").innerHTML=av.map(function(c){return "<button type=\"button\" data-pc=\""+c[0]+"\" aria-pressed=\""+(c[0]===pcat)+"\">"+esc(c[1])+"</button>"}).join("");
  var list=getPlayerStats(openPlayer,pcat).filter(function(s){return label(s.k).toLowerCase().indexOf(pq.toLowerCase())>-1}).sort(function(a,b){return a.rank!==b.rank?a.rank-b.rank:b.val-a.val});
  $("#pdb").innerHTML=list.length?list.map(function(s){
    var rc=s.rank<=3?" rank-"+s.rank:"";
    return "<tr><td><button type=\"button\" class=\"link\" data-k=\""+esc(s.k)+"\" data-c=\""+esc(s.c)+"\">"+iconHtml(s.k,s.c)+"<span>"+esc(label(s.k))+"</span></button></td><td class=\"num\">"+esc(fmt(s.k,s.val,s.c))+"</td><td class=\"num\"><span class=\"rank-badge"+rc+"\">#"+s.rank+"</span></td></tr>";
  }).join(""):"<tr><td colspan=\"3\" class=\"empty\">Keine Einträge.</td></tr>";
}

function openPlayerModal(name){
  openPlayer=name; pq=""; $("#pq").value="";
  if($("#dlg").open) $("#dlg").close();
  renderPlayerDlg();
  if(!$("#pdlg").open) $("#pdlg").showModal();
}

function render(){
  try {
    if(!(data.c||{})[cat]) cat=Object.keys(data.c||{})[0]||"custom";
    renderTot(); renderPlayersBar(); renderTabs(); renderList(); renderDlg(); renderPlayerDlg();
    $("#upd").textContent=(demo?"Demo-Daten, ":"")+"Stand "+new Date(data.updated||Date.now()).toLocaleString("de",{dateStyle:"short",timeStyle:"short"});
  } catch(err) {
    console.error(err);
  }
}

function load(){
  if(!DATA_URL)return;
  fetch(DATA_URL+"?t="+Date.now(),{cache:"no-store"}).then(function(r){
    if(!r.ok) throw new Error("HTTP "+r.status);
    return r.json();
  }).then(function(d){
    if(d && d.c){ data=d; demo=false; render(); }
  }).catch(function(e){ console.warn("Konnte stats.json nicht laden:", e); });
}

$("#tabs").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;cat=b.dataset.c;renderTabs();renderList()});
$("#list").addEventListener("click",function(ev){
  var p=ev.target.closest("[data-p]"); if(p){openPlayerModal(p.dataset.p);return}
  var b=ev.target.closest("button[data-k]"); if(!b)return;
  open={c:cat,k:b.dataset.k}; renderDlg(); $("#dlg").showModal();
});
$("#pbar").addEventListener("click",function(ev){var b=ev.target.closest("[data-p]");if(b)openPlayerModal(b.dataset.p)});
$("#dlg").addEventListener("click",function(ev){
  var p=ev.target.closest("[data-p]"); if(p){openPlayerModal(p.dataset.p);return}
  if(ev.target===this){this.close();open=null}
});
$("#ptabs").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;pcat=b.dataset.pc;renderPlayerDlg()});
$("#pdb").addEventListener("click",function(ev){
  var b=ev.target.closest("button[data-k]"); if(!b)return;
  $("#pdlg").close(); open={c:b.dataset.c||pcat,k:b.dataset.k}; renderDlg(); $("#dlg").showModal();
});
$("#q").addEventListener("input",function(){q=this.value;renderList()});
$("#pq").addEventListener("input",function(){pq=this.value;renderPlayerDlg()});
$("#x").addEventListener("click",function(){$("#dlg").close();open=null});
$("#px").addEventListener("click",function(){$("#pdlg").close();openPlayer=null});
$("#pdlg").addEventListener("click",function(ev){if(ev.target===this){this.close();openPlayer=null}});
render(); load(); setInterval(load,60000);
</script>
