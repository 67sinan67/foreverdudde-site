<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statistiken – Forever Dudde</title>
<style>
:root{--bg:#fff;--text:#1a1a1a;--muted:#666;--line:#ddd;--soft:#f5f5f5;--accent:#1f5fbf;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#16181c;--text:#e6e6e6;--muted:#9a9a9a;--line:#2e3238;--soft:#1e2126;--accent:#7aa7f0;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#16181c;--text:#e6e6e6;--muted:#9a9a9a;--line:#2e3238;--soft:#1e2126;--accent:#7aa7f0;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding:0 20px 56px}
header{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:16px 0;border-bottom:1px solid var(--line)}
header nav a{margin-right:16px;text-decoration:none}
header nav a[aria-current]{font-weight:600;color:var(--text)}
.muted{color:var(--muted);font-size:.9rem}
h1{font-size:1.5rem;font-weight:600;margin:24px 0 4px}
dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px 20px;margin:20px 0 24px;padding:14px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
dt{color:var(--muted);font-size:.85rem}
dd{margin:0;font-size:1.25rem;font-variant-numeric:tabular-nums}
.tabs{display:flex;flex-wrap:wrap;gap:4px 18px;border-bottom:1px solid var(--line);margin-bottom:14px}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;color:var(--muted);font:inherit;padding:6px 0;cursor:pointer}
.tabs button[aria-pressed="true"]{color:var(--text);border-color:var(--accent)}
#q{width:100%;font:inherit;color:inherit;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{text-align:left;font-weight:600;font-size:.85rem;color:var(--muted);padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:7px 8px;border-bottom:1px solid var(--line)}
.num{text-align:right}
th.num{text-align:right}
.link{background:none;border:0;padding:0;font:inherit;color:var(--accent);cursor:pointer;text-align:left}
.link:hover{text-decoration:underline}
.empty{color:var(--muted);padding:16px 0}
dialog{width:min(520px,calc(100% - 32px));max-height:85vh;overflow:auto;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.dh h2{font-size:1.1rem;font-weight:600;margin:0}
.dh button{background:none;border:1px solid var(--line);border-radius:4px;color:inherit;font:inherit;padding:3px 10px;cursor:pointer}
.share{display:inline-block;width:70px;height:6px;background:var(--soft);vertical-align:middle;margin-left:8px}
.share i{display:block;height:100%;background:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <nav><a href="index.html">Forever Dudde</a><a href="stats.html" aria-current="page">Statistiken</a></nav>
    <span class="muted" id="upd"></span>
  </header>
  <h1>Server-Statistiken</h1>
  <p class="muted">Summe aller Spieler. Einen Eintrag anklicken, um die Rangliste zu sehen.</p>
  <dl id="tot"></dl>
  <nav class="tabs" id="tabs" aria-label="Kategorien"></nav>
  <input id="q" type="search" placeholder="Suchen" aria-label="Statistik suchen">
  <table><thead><tr><th>Statistik</th><th class="num">Gesamt</th></tr></thead><tbody id="list"></tbody></table>
</div>
<dialog id="dlg">
  <div class="dh"><h2 id="dt"></h2><button id="x" type="button">Schließen</button></div>
  <p class="muted" id="ds"></p>
  <table><thead><tr><th>#</th><th>Spieler</th><th class="num">Wert</th><th class="num">Anteil</th></tr></thead><tbody id="db"></tbody></table>
</dialog>

<script>
// Adresse der stats.json eintragen, z. B.
// https://raw.githubusercontent.com/DEINUSER/foreverdudde-stats/main/stats.json
var DATA_URL = "https://raw.githubusercontent.com/67sinan67/foreverdudde-stats/main/stats.json";

var P=["Mika","Lena","Tom","Ayla","Dudenhofen"];
function mk(v){var p=P.map(function(n,i){return [n,v[i]]}).filter(function(x){return x[1]}).sort(function(a,b){return b[1]-a[1]});return {t:p.reduce(function(a,x){return a+x[1]},0),p:p}}
var DEMO={updated:new Date().toISOString(),players:5,c:{
  custom:{"minecraft:walk_one_cm":mk([9800000,6400000,3100000,2200000,12500000]),"minecraft:sprint_one_cm":mk([4100000,2900000,800000,1500000,6000000]),"minecraft:aviate_one_cm":mk([21000000,0,5000000,0,33000000]),"minecraft:play_time":mk([5400000,3800000,2100000,1700000,8900000]),"minecraft:deaths":mk([41,12,7,19,63]),"minecraft:mob_kills":mk([2300,1100,420,900,3900]),"minecraft:jump":mk([8200,5100,2300,3000,14000])},
  mined:{"minecraft:stone":mk([21000,9000,15000,3000,40000]),"minecraft:diamond_ore":mk([140,60,0,22,310]),"minecraft:oak_log":mk([900,2200,400,1500,1300])},
  crafted:{"minecraft:torch":mk([900,300,1200,200,2400]),"minecraft:bread":mk([0,320,0,140,60])},
  killed:{"minecraft:zombie":mk([800,300,100,200,1500]),"minecraft:creeper":mk([140,90,60,110,400])},
  killed_by:{"minecraft:creeper":mk([20,4,3,9,31])}
}};
var CATS=[["custom","Allgemein"],["mined","Abgebaut"],["crafted","Hergestellt"],["used","Benutzt"],["broken","Kaputtgegangen"],["picked_up","Aufgehoben"],["dropped","Fallen gelassen"],["killed","Getötet"],["killed_by","Gestorben durch"]];
var L={"minecraft:walk_one_cm":"Zu Fuß gegangen","minecraft:sprint_one_cm":"Gesprintet","minecraft:crouch_one_cm":"Geschlichen","minecraft:swim_one_cm":"Geschwommen","minecraft:fly_one_cm":"Geflogen","minecraft:aviate_one_cm":"Mit Elytra geflogen","minecraft:boat_one_cm":"Mit Boot gefahren","minecraft:horse_one_cm":"Auf Pferd geritten","minecraft:minecart_one_cm":"Mit Lore gefahren","minecraft:climb_one_cm":"Geklettert","minecraft:fall_one_cm":"Gefallen","minecraft:play_time":"Spielzeit","minecraft:deaths":"Tode","minecraft:mob_kills":"Mobs getötet","minecraft:player_kills":"Spieler getötet","minecraft:jump":"Sprünge","minecraft:damage_dealt":"Schaden verursacht","minecraft:damage_taken":"Schaden erlitten"};
var data=DEMO,demo=true,cat="custom",q="",open=null;
var $=function(s){return document.querySelector(s)};
function esc(s){var d=document.createElement("div");d.textContent=String(s);return d.innerHTML}
function nf(v,d){return v.toLocaleString("de",{maximumFractionDigits:d||0})}
function label(k){return L[k]||k.replace("minecraft:","").replace(/_/g," ").replace(/^./,function(c){return c.toUpperCase()})}
function fmt(k,v,c){
  if(c==="custom"){
    if(/_one_cm$/.test(k)){var m=v/100;return m>=1000?nf(m/1000,1)+" km":nf(m)+" m"}
    if(/play_time|play_one_minute|sneak_time|total_world_time/.test(k))return nf(v/72000,1)+" h";
  }
  return nf(v);
}
function sumC(c,f){var o=(data.c||{})[c]||{},s=0;Object.keys(o).forEach(function(k){if(!f||f(k))s+=o[k].t});return s}
function entries(c){var o=(data.c||{})[c]||{};return Object.keys(o).filter(function(k){return !/time_since_/.test(k)}).map(function(k){return [k,o[k]]})}

function renderTot(){
  var t=[["Spielzeit",nf(sumC("custom",function(k){return /play_time|play_one_minute/.test(k)})/72000,1)+" h"],
    ["Strecke",nf(sumC("custom",function(k){return /_one_cm$/.test(k)})/100000,1)+" km"],
    ["Blöcke abgebaut",nf(sumC("mined"))],
    ["Mobs getötet",nf(sumC("custom",function(k){return /mob_kills/.test(k)}))],
    ["Tode",nf(sumC("custom",function(k){return /:deaths$/.test(k)}))]];
  $("#tot").innerHTML=t.map(function(x){return "<div><dt>"+esc(x[0])+"</dt><dd>"+esc(x[1])+"</dd></div>"}).join("");
}
function renderTabs(){
  $("#tabs").innerHTML=CATS.filter(function(c){return (data.c||{})[c[0]]}).map(function(c){return "<button type=\"button\" data-c=\""+c[0]+"\" aria-pressed=\""+(c[0]===cat)+"\">"+esc(c[1])+"</button>"}).join("");
}
function renderList(){
  var es=entries(cat).filter(function(e){return label(e[0]).toLowerCase().indexOf(q.toLowerCase())>-1}).sort(function(a,b){return b[1].t-a[1].t});
  $("#list").innerHTML=es.length?es.map(function(e){return "<tr><td><button class=\"link\" type=\"button\" data-k=\""+esc(e[0])+"\">"+esc(label(e[0]))+"</button></td><td class=\"num\">"+esc(fmt(e[0],e[1].t,cat))+"</td></tr>"}).join(""):"<tr><td colspan=\"2\" class=\"empty\">Nichts gefunden.</td></tr>";
}
function renderDlg(){
  if(!open)return;
  var e=((data.c||{})[open.c]||{})[open.k];if(!e)return;
  $("#dt").textContent=label(open.k);
  $("#ds").textContent="Gesamt "+fmt(open.k,e.t,open.c)+", "+e.p.length+" Spieler";
  $("#db").innerHTML=e.p.map(function(p,i){var s=p[1]/e.t*100;return "<tr><td>"+(i+1)+"</td><td>"+esc(p[0])+"</td><td class=\"num\">"+esc(fmt(open.k,p[1],open.c))+"</td><td class=\"num\">"+nf(s,1)+" %<span class=\"share\"><i style=\"width:"+s+"%\"></i></span></td></tr>"}).join("");
}
function render(){
  if(!(data.c||{})[cat])cat=Object.keys(data.c||{})[0]||"custom";
  renderTot();renderTabs();renderList();renderDlg();
  $("#upd").textContent=(demo?"Demo-Daten, ":"")+"Stand "+new Date(data.updated).toLocaleString("de",{dateStyle:"short",timeStyle:"short"});
}
function load(){
  if(!DATA_URL)return;
  fetch(DATA_URL+"?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){data=d;demo=false;render()}).catch(function(){});
}
$("#tabs").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;cat=b.dataset.c;renderTabs();renderList()});
$("#list").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;open={c:cat,k:b.dataset.k};renderDlg();$("#dlg").showModal()});
$("#q").addEventListener("input",function(){q=this.value;renderList()});
$("#x").addEventListener("click",function(){$("#dlg").close();open=null});
$("#dlg").addEventListener("click",function(ev){if(ev.target===this){this.close();open=null}});
render();load();setInterval(load,60000);
</script>
</body>
</html>
