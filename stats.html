<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statistiken – Forever Dudde</title>
<style>
:root {
  --bg: #f8f9fb;
  --surface: #ffffff;
  --text: #16191f;
  --muted: #646b78;
  --line: #e4e7ec;
  --soft: #f1f3f7;
  --accent: #1f5fbf;
  --accent-soft: #eef4ff;
  --gold: #d97706;
  --gold-bg: #fef3c7;
  --silver: #4b5563;
  --silver-bg: #e5e7eb;
  --bronze: #b45309;
  --bronze-bg: #ffedd5;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  max-width: 1240px;
  margin: 0 auto;
  padding: 0 28px 64px;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 18px 0;
  border-bottom: 1px solid var(--line);
}
header nav {
  display: flex;
  gap: 24px;
}
header nav a {
  text-decoration: none;
  color: var(--muted);
  font-weight: 500;
  padding: 4px 0;
  border-bottom: 2px solid transparent;
  transition: color .15s ease, border-color .15s ease;
}
header nav a:hover { color: var(--text); }
header nav a[aria-current] {
  font-weight: 600;
  color: var(--text);
  border-bottom-color: var(--accent);
}
.muted { color: var(--muted); font-size: .9rem; }
h1 { font-size: 1.6rem; font-weight: 600; margin: 26px 0 4px; }

/* Übersichtskarten oben */
dl {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
  gap: 14px;
  margin: 20px 0;
}
dl > div {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 14px 16px;
  box-shadow: 0 1px 2px rgba(0, 0, 0, .02);
}
dt { color: var(--muted); font-size: .82rem; font-weight: 500; }
dd { margin: 4px 0 0; font-size: 1.35rem; font-weight: 600; font-variant-numeric: tabular-nums; }

/* Klickbare Spieler-Leiste */
.players-bar {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
  margin: 0 0 22px;
}
.players-bar .lbl {
  font-size: .85rem;
  color: var(--muted);
  margin-right: 4px;
}
.p-chip {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 20px;
  padding: 5px 12px 5px 7px;
  font: inherit;
  font-size: .9rem;
  color: var(--text);
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease, transform .12s ease;
}
.p-chip:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
}
.p-chip:active { transform: scale(.97); }

/* Hauptbereich (Kategorien, Suche & Tabelle) */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 10px;
  padding: 18px 22px 24px;
  box-shadow: 0 1px 3px rgba(0, 0, 0, .02);
}
.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
  margin-bottom: 12px;
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 18px;
}
.tabs button {
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  color: var(--muted);
  font: inherit;
  font-weight: 500;
  padding: 8px 2px;
  margin-bottom: -1px;
  cursor: pointer;
  white-space: nowrap;
  transition: color .15s ease, border-color .15s ease;
}
.tabs button:hover { color: var(--text); }
.tabs button[aria-pressed="true"] {
  color: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
}
#q {
  width: 260px;
  max-width: 100%;
  font: inherit;
  font-size: .92rem;
  color: inherit;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 7px 12px;
  margin-bottom: 8px;
  transition: border-color .15s ease, background .15s ease;
}
#q:focus { background: var(--surface); border-color: var(--accent); outline: none; }

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th {
  text-align: left;
  font-weight: 600;
  font-size: .82rem;
  text-transform: uppercase;
  letter-spacing: .03em;
  color: var(--muted);
  padding: 8px 10px;
  border-bottom: 1px solid var(--line);
}
td { padding: 9px 10px; border-bottom: 1px solid var(--line); }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .12s ease; }
tbody tr:hover { background: var(--bg); }
.num { text-align: right; white-space: nowrap; }
th.num { text-align: right; }

.link {
  background: none;
  border: 0;
  padding: 2px 0;
  font: inherit;
  color: var(--accent);
  cursor: pointer;
  text-align: left;
  display: inline-flex;
  align-items: center;
  gap: 9px;
}
.link:hover span { text-decoration: underline; }
.plink {
  background: none;
  border: 0;
  padding: 2px 0;
  font: inherit;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  text-align: left;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  transition: color .12s ease;
}
.plink:hover { color: var(--accent); }
.plink:hover span { text-decoration: underline; }

/* Icons & Spielerköpfe (Nearest-Neighbour) */
.ico {
  width: 18px;
  height: 18px;
  object-fit: contain;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  flex-shrink: 0;
  pointer-events: none;
}
.head {
  width: 20px;
  height: 20px;
  border-radius: 3px;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  flex-shrink: 0;
  background: var(--soft);
}
.empty { color: var(--muted); padding: 24px 10px; text-align: center; }

/* Dezente Animationen für Tabellenwechsel & Fenster */
@keyframes fadeInRows {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.anim-list tr { animation: fadeInRows .16s ease-out both; }

dialog {
  width: min(680px, calc(100% - 28px));
  max-height: 86vh;
  overflow: auto;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 22px 24px;
  box-shadow: 0 20px 45px rgba(0, 0, 0, .14);
}
dialog[open] {
  animation: dlgOpen .2s cubic-bezier(.16, 1, .3, 1) forwards;
}
dialog::backdrop {
  background: rgba(15, 23, 42, .35);
  backdrop-filter: blur(2px);
  animation: backdropFade .2s ease forwards;
}
@keyframes dlgOpen {
  from { opacity: 0; transform: translateY(10px) scale(.98); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes backdropFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.dh {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  position: sticky;
  top: -22px;
  background: var(--surface);
  padding: 4px 0 12px;
  border-bottom: 1px solid var(--line);
  z-index: 2;
}
.dh h2 {
  font-size: 1.15rem;
  font-weight: 600;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 9px;
}
.dh h2 .ico { width: 22px; height: 22px; }
.dh h2 .head { width: 24px; height: 24px; }
.dh button {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 6px;
  color: inherit;
  font: inherit;
  font-size: .9rem;
  padding: 5px 12px;
  cursor: pointer;
  transition: background .15s ease;
}
.dh button:hover { background: var(--soft); }

/* Tribüne für Plätze 1-3 */
.podium {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  align-items: end;
  margin: 18px 0 20px;
  padding: 16px 12px 0;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 10px;
}
.pod-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.pod-player {
  background: none;
  border: 0;
  padding: 4px;
  font: inherit;
  color: var(--text);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  transition: transform .15s ease, color .15s ease;
}
.pod-player:hover { transform: translateY(-2px); color: var(--accent); }
.pod-player .head { width: 36px; height: 36px; border-radius: 4px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
.pod-1 .pod-player .head { width: 44px; height: 44px; }
.pod-name { font-weight: 600; font-size: .9rem; max-width: 130px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pod-val { font-size: .8rem; color: var(--muted); margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.pod-bar {
  width: 100%;
  border-radius: 6px 6px 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 1rem;
  border: 1px solid transparent;
  border-bottom: 0;
}
.pod-1 .pod-bar { height: 64px; background: var(--gold-bg); color: var(--gold); border-color: #fde68a; font-size: 1.15rem; }
.pod-2 .pod-bar { height: 48px; background: var(--silver-bg); color: var(--silver); border-color: #d1d5db; }
.pod-3 .pod-bar { height: 36px; background: var(--bronze-bg); color: var(--bronze); border-color: #fed7aa; }

/* Rang-Badges hinter den Stats im Spielerfenster */
.rank-badge {
  display: inline-block;
  min-width: 34px;
  text-align: center;
  font-size: .78rem;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 12px;
  margin-left: 8px;
  background: var(--soft);
  color: var(--muted);
}
.rank-1 { background: var(--gold-bg); color: var(--gold); }
.rank-2 { background: var(--silver-bg); color: var(--silver); }
.rank-3 { background: var(--bronze-bg); color: var(--bronze); }

.share {
  display: inline-block;
  width: 64px;
  height: 6px;
  border-radius: 3px;
  overflow: hidden;
  background: var(--soft);
  vertical-align: middle;
  margin-left: 8px;
}
.share i { display: block; height: 100%; background: var(--accent); }

/* Mobile Optimierungen */
@media (max-width: 720px) {
  .wrap { padding: 0 14px 48px; }
  h1 { font-size: 1.4rem; margin-top: 18px; }
  dl { grid-template-columns: repeat(2, 1fr); gap: 10px; }
  .panel { padding: 14px; }
  .toolbar { flex-direction: column; align-items: stretch; gap: 10px; }
  .tabs {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  #q { width: 100%; margin-bottom: 10px; }
  .share { display: none; }
  dialog {
    width: 100%;
    max-width: 100%;
    max-height: 90vh;
    margin: auto 0 0 0;
    border-radius: 14px 14px 0 0;
    padding: 18px 16px 24px;
  }
  .podium { gap: 6px; padding: 12px 8px 0; }
  .pod-name { max-width: 90px; font-size: .82rem; }
}
</style>
</head>

  <table>
    <thead><tr><th>Statistik</th><th class="num">Wert</th><th class="num">Platzierung</th></tr></thead>
    <tbody id="pdb" class="anim-list"></tbody>
  </table>
</dialog>

function toTitleCase(id){return id.split("_").map(function(w){return w?w.charAt(0).toUpperCase()+w.slice(1):""}).join("_")}
function toPascalCase(id){return id.split("_").map(function(w){return w?w.charAt(0).toUpperCase()+w.slice(1):""}).join("")}

function getIconCandidates(k, c){
  var id = k.replace(/^minecraft:/, "");
  if(c === "custom"){
    var customFile = CUSTOM_ICONS[k] || CUSTOM_ICONS["minecraft:" + id];
    if(customFile){
      var list = [WIKI_FP + customFile];
      if(/Face\.png$/.test(customFile)) list.push(WIKI_FP + customFile.replace(/([a-z])([A-Z])/g, "$1_$2"));
      return list;
    }
    return [WIKI_FP + "Invicon_" + toTitleCase(id) + ".png"];
  }
  if(c === "killed" || c === "killed_by"){
    if(id === "player") return [WIKI_FP + "AlexFace.png", WIKI_FP + "Alex_Face.png"];
    var pascal = toPascalCase(id), title = toTitleCase(id);
    return [WIKI_FP + pascal + "Face.png", WIKI_FP + title + "_Face.png", WIKI_FP + "Invicon_" + title + "_Spawn_Egg.png", WIKI_FP + "Invicon_" + title + ".png"];
  }
  var norm = id.replace(/^waxed_/, "").replace(/_wall_hanging_sign$/, "_hanging_sign").replace(/_wall_sign$/, "_sign")
               .replace(/_wall_banner$/, "_banner").replace(/_wall_head$/, "_head").replace(/_wall_skull$/, "_skull")
               .replace(/_wall_torch$/, "_torch").replace(/_wall_fan$/, "_fan").replace(/^wall_torch$/, "torch")
               .replace(/_candle_cake$/, "_candle").replace(/^potted_/, "");
  var urls = [];
  if(ITEM_NAME_MAP[norm]) urls.push(WIKI_FP + "Invicon_" + ITEM_NAME_MAP[norm] + ".png");
  if(/_armor_trim_smithing_template$/.test(norm)) urls.push(WIKI_FP + "Invicon_" + toTitleCase(norm.replace(/_smithing_template$/, "")) + ".png");
  if(/_banner_pattern$/.test(norm)) urls.push(WIKI_FP + "Invicon_Banner_Pattern.png");
  var tc = toTitleCase(norm);
  urls.push(WIKI_FP + "Invicon_" + tc + ".png");
  var lowerPrep = tc.replace(/_Of_/g, "_of_").replace(/_The_/g, "_the_").replace(/_On_/g, "_on_").replace(/_A_/g, "_a_").replace(/_With_/g, "_with_");
  if(lowerPrep !== tc) urls.push(WIKI_FP + "Invicon_" + lowerPrep + ".png");
  if(/_block$/.test(norm)) urls.push(WIKI_FP + "Invicon_Block_of_" + toTitleCase(norm.replace(/_block$/, "")) + ".png");
  urls.push(WIKI_FP + tc + ".png");
  return urls;
}

window.icoErr = function(img){
  var list = (img.getAttribute("data-fb") || "").split("|").filter(Boolean);
  var idx = parseInt(img.getAttribute("data-idx") || "0", 10) + 1;
  if(idx < list.length){
    img.setAttribute("data-idx", String(idx));
    img.src = list[idx];
  } else {
    img.style.display = "none";
  }
};

function iconHtml(k, c){
  var urls = getIconCandidates(k, c);
  if(!urls.length) return "";
  return "<img class=\"ico\" src=\"" + esc(urls[0]) + "\" data-fb=\"" + esc(urls.join("|")) + "\" data-idx=\"0\" alt=\"\" loading=\"lazy\" onerror=\"icoErr(this)\">";
}

// 2D-Spielerkopf neben Namen (mc-heads -> minotar -> AlexFace Fallback)
function headHtml(name){
  var u = encodeURIComponent(name);
  var fb = [
    "https://mc-heads.net/avatar/" + u + "/32",
    "https://minotar.net/helm/" + u + "/32.png",
    WIKI_FP + "AlexFace.png"
  ];
  return "<img class=\"head\" src=\"" + esc(fb[0]) + "\" data-fb=\"" + esc(fb.join("|")) + "\" data-idx=\"0\" alt=\"\" loading=\"lazy\" onerror=\"icoErr(this)\">";
}

var data=DEMO,demo=true,cat="custom",q="",open=null,openPlayer=null,pcat="custom",pq="";
var $=function(s){return document.querySelector(s)};
function esc(s){var d=document.createElement("div");d.textContent=String(s);return d.innerHTML}
function nf(v,d){return v.toLocaleString("de",{maximumFractionDigits:d||0})}
function label(k){return L[k]||k.replace("minecraft:","").replace(/_/g," ").replace(/^./,function(c){return c.toUpperCase()})}
function fmt(k,v,c){
  if(c==="custom"){
    if(/_one_cm$/.test(k)){var m=v/100;return m>=1000?nf(m/1000,1)+" km":nf(m)+" m"}
    if(/play_time|play_one_minute|sneak_time|total_world_time/.test(k))return nf(v/72000,1)+" h";
  }
  return nf(v);
}
function sumC(c,f){var o=(data.c||{})[c]||{},s=0;Object.keys(o).forEach(function(k){if(!f||f(k))s+=o[k].t});return s}
function entries(c){var o=(data.c||{})[c]||{};return Object.keys(o).filter(function(k){return !/time_since_/.test(k)}).map(function(k){return [k,o[k]]})}

// Alle aktiven Spielernamen aus den Daten ermitteln
function allPlayers(){
  var map={};
  Object.keys(data.c||{}).forEach(function(c){
    var o=data.c[c]||{};
    Object.keys(o).forEach(function(k){
      ((o[k]||{}).p||[]).forEach(function(row){ map[row[0]]=true; });
    });
  });
  return Object.keys(map).sort(function(a,b){return a.localeCompare(b,"de")});
}

function renderTot(){
  var t=[["Spielzeit",nf(sumC("custom",function(k){return /play_time|play_one_minute/.test(k)})/72000,1)+" h"],
    ["Strecke",nf(sumC("custom",function(k){return /_one_cm$/.test(k)})/100000,1)+" km"],
    ["Blöcke abgebaut",nf(sumC("mined"))],
    ["Mobs getötet",nf(sumC("custom",function(k){return /mob_kills/.test(k)}))],
    ["Tode",nf(sumC("custom",function(k){return /:deaths$/.test(k)}))]];
  $("#tot").innerHTML=t.map(function(x){return "<div><dt>"+esc(x[0])+"</dt><dd>"+esc(x[1])+"</dd></div>"}).join("");
}

function renderPlayersBar(){
  var ps=allPlayers();
  if(!ps.length){$("#pbar").innerHTML="";return}
  $("#pbar").innerHTML="<span class=\"lbl\">Spieler:</span>"+ps.map(function(n){
    return "<button type=\"button\" class=\"p-chip\" data-p=\""+esc(n)+"\">"+headHtml(n)+"<span>"+esc(n)+"</span></button>";
  }).join("");
}

function renderTabs(){
  $("#tabs").innerHTML=CATS.filter(function(c){return (data.c||{})[c[0]]}).map(function(c){return "<button type=\"button\" data-c=\""+c[0]+"\" aria-pressed=\""+(c[0]===cat)+"\">"+esc(c[1])+"</button>"}).join("");
}

function renderList(){
  var es=entries(cat).filter(function(e){return label(e[0]).toLowerCase().indexOf(q.toLowerCase())>-1}).sort(function(a,b){return b[1].t-a[1].t});
  $("#list").innerHTML=es.length?es.map(function(e){return "<tr><td><button class=\"link\" type=\"button\" data-k=\""+esc(e[0])+"\">"+iconHtml(e[0],cat)+"<span>"+esc(label(e[0]))+"</span></button></td><td class=\"num\">"+esc(fmt(e[0],e[1].t,cat))+"</td></tr>"}).join(""):"<tr><td colspan=\"2\" class=\"empty\">Nichts gefunden.</td></tr>";
}

function renderPodium(pList, k, c){
  var pod=$("#podium");
  if(!pList || !pList.length){pod.style.display="none";pod.innerHTML="";return}
  pod.style.display="grid";
  // Klassische Tribünen-Reihenfolge: Platz 2 (links), Platz 1 (Mitte), Platz 3 (rechts)
  var order = [1, 0, 2];
  pod.innerHTML = order.map(function(idx){
    var item = pList[idx];
    var rank = idx + 1;
    if(!item) return "<div class=\"pod-slot pod-"+rank+"\"></div>";
    return "<div class=\"pod-slot pod-"+rank+"\">" +
      "<button type=\"button\" class=\"pod-player\" data-p=\""+esc(item[0])+"\">" +
        headHtml(item[0]) +
        "<span class=\"pod-name\">"+esc(item[0])+"</span>" +
      "</button>" +
      "<span class=\"pod-val\">"+esc(fmt(k, item[1], c))+"</span>" +
      "<div class=\"pod-bar\">"+rank+".</div>" +
    "</div>";
  }).join("");
}

function renderDlg(){
  if(!open)return;
  var e=((data.c||{})[open.c]||{})[open.k];if(!e)return;
  $("#dt").innerHTML=iconHtml(open.k,open.c)+"<span>"+esc(label(open.k))+"</span>";
  $("#ds").textContent="Gesamt "+fmt(open.k,e.t,open.c)+" • "+e.p.length+" Spieler";
  renderPodium(e.p, open.k, open.c);
  $("#db").innerHTML=e.p.map(function(p,i){
    var s=p[1]/e.t*100;
    return "<tr><td>"+(i+1)+".</td><td><button type=\"button\" class=\"plink\" data-p=\""+esc(p[0])+"\">"+headHtml(p[0])+"<span>"+esc(p[0])+"</span></button></td><td class=\"num\">"+esc(fmt(open.k,p[1],open.c))+"</td><td class=\"num\">"+nf(s,1)+" %<span class=\"share\"><i style=\"width:"+s+"%\"></i></span></td></tr>";
  }).join("");
}

// Einzelspieler-Ansicht inkl. Platzierung hinter jedem Stat
function getPlayerStats(pName, cKey){
  var o=(data.c||{})[cKey]||{}, res=[];
  Object.keys(o).filter(function(k){return !/time_since_/.test(k)}).forEach(function(k){
    var plist=(o[k]||{}).p||[];
    for(var i=0;i<plist.length;i++){
      if(plist[i][0]===pName){
        res.push({k:k, c:cKey, val:plist[i][1], rank:i+1, totalPlayers:plist.length});
        break;
      }
    }
  });
  return res;
}

function renderPlayerDlg(){
  if(!openPlayer)return;
  var availCats = CATS.filter(function(c){return getPlayerStats(openPlayer, c[0]).length > 0});
  if(availCats.length && !availCats.some(function(c){return c[0]===pcat})){
    pcat = availCats[0][0];
  }
  $("#pdt").innerHTML = headHtml(openPlayer) + "<span>" + esc(openPlayer) + "</span>";

  var totalEntries = 0, top1Count = 0;
  CATS.forEach(function(c){
    getPlayerStats(openPlayer, c[0]).forEach(function(st){
      totalEntries++;
      if(st.rank === 1) top1Count++;
    });
  });
  $("#pds").textContent = totalEntries + " Statistiken erfasst • " + top1Count + "× Platz 1";

  $("#ptabs").innerHTML = availCats.map(function(c){
    return "<button type=\"button\" data-pc=\""+c[0]+"\" aria-pressed=\""+(c[0]===pcat)+"\">"+esc(c[1])+"</button>";
  }).join("");

  var list = getPlayerStats(openPlayer, pcat).filter(function(st){
    return label(st.k).toLowerCase().indexOf(pq.toLowerCase()) > -1;
  }).sort(function(a,b){
    return a.rank !== b.rank ? a.rank - b.rank : b.val - a.val;
  });

  $("#pdb").innerHTML = list.length ? list.map(function(st){
    var rCls = st.rank <= 3 ? " rank-" + st.rank : "";
    return "<tr>" +
      "<td><button type=\"button\" class=\"link\" data-k=\""+esc(st.k)+"\" data-c=\""+esc(st.c)+"\">"+iconHtml(st.k, st.c)+"<span>"+esc(label(st.k))+"</span></button></td>" +
      "<td class=\"num\">"+esc(fmt(st.k, st.val, st.c))+"</td>" +
      "<td class=\"num\"><span class=\"rank-badge"+rCls+"\" title=\"Platz "+st.rank+" von "+st.totalPlayers+"\">#"+st.rank+"</span></td>" +
    "</tr>";
  }).join("") : "<tr><td colspan=\"3\" class=\"empty\">Keine Einträge in dieser Kategorie.</td></tr>";
}

function openPlayerModal(name){
  openPlayer = name;
  pq = "";
  $("#pq").value = "";
  if($("#dlg").open) $("#dlg").close();
  renderPlayerDlg();
  if(!$("#pdlg").open) $("#pdlg").showModal();
}

function render(){
  if(!(data.c||{})[cat])cat=Object.keys(data.c||{})[0]||"custom";
  renderTot();renderPlayersBar();renderTabs();renderList();renderDlg();renderPlayerDlg();
  $("#upd").textContent=(demo?"Demo-Daten, ":"")+"Stand "+new Date(data.updated).toLocaleString("de",{dateStyle:"short",timeStyle:"short"});
}
function load(){
  if(!DATA_URL)return;
  fetch(DATA_URL+"?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json()}).then(function(d){data=d;demo=false;render()}).catch(function(){});
}

$("#tabs").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;cat=b.dataset.c;renderTabs();renderList()});
$("#list").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;open={c:cat,k:b.dataset.k};renderDlg();$("#dlg").showModal()});
$("#pbar").addEventListener("click",function(ev){var b=ev.target.closest("[data-p]");if(!b)return;openPlayerModal(b.dataset.p)});
$("#dlg").addEventListener("click",function(ev){
  var pBtn=ev.target.closest("[data-p]");
  if(pBtn){openPlayerModal(pBtn.dataset.p);return}
  if(ev.target===this){this.close();open=null}
});
$("#ptabs").addEventListener("click",function(ev){var b=ev.target.closest("button");if(!b)return;pcat=b.dataset.pc;renderPlayerDlg()});
$("#pdb").addEventListener("click",function(ev){
  var b=ev.target.closest("button[data-k]");
  if(!b)return;
  $("#pdlg").close();
  open={c:b.dataset.c||pcat,k:b.dataset.k};
  renderDlg();
  $("#dlg").showModal();
});
$("#q").addEventListener("input",function(){q=this.value;renderList()});
$("#pq").addEventListener("input",function(){pq=this.value;renderPlayerDlg()});
$("#x").addEventListener("click",function(){$("#dlg").close();open=null});
$("#px").addEventListener("click",function(){$("#pdlg").close();openPlayer=null});
$("#pdlg").addEventListener("click",function(ev){if(ev.target===this){this.close();openPlayer=null}});
render();load();setInterval(load,60000);
