<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statistiken – Forever Dudde</title>
<style>
:root {
  --bg: #f6f8fb;
  --surface: #ffffff;
  --text: #14181f;
  --muted: #5e6675;
  --line: #e2e6ee;
  --soft: #eef1f6;
  --accent: #1d5bbf;
  --accent-soft: #eaf2ff;
  --gold: #c97306;
  --gold-bg: #fef3c7;
  --silver: #4b5563;
  --silver-bg: #e5e7eb;
  --bronze: #a84b08;
  --bronze-bg: #ffedd5;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
/* Dynamische Skalierung für 1080p, 1440p, 4K und Mobile */
html {
  font-size: clamp(16px, 0.55vw + 9px, 24px);
  scroll-padding-top: env(safe-area-inset-top, 0px);
}
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 1rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.wrap {
  width: min(86rem, 94vw);
  margin: 0 auto;
  padding: 0 1.2rem 4rem;
}
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 1rem;
  flex-wrap: wrap;
  padding: 1.15rem 0;
  border-bottom: 1px solid var(--line);
}
header nav {
  display: flex;
  gap: 1.6rem;
}
header nav a {
  text-decoration: none;
  color: var(--muted);
  font-size: 1.05rem;
  font-weight: 500;
  padding: 0.3rem 0;
  border-bottom: 3px solid transparent;
  transition: color .15s ease, border-color .15s ease;
}
header nav a:hover { color: var(--text); }
header nav a[aria-current] {
  font-weight: 600;
  color: var(--text);
  border-bottom-color: var(--accent);
}
.muted { color: var(--muted); font-size: .92rem; }
h1 { font-size: 1.85rem; font-weight: 700; margin: 1.5rem 0 0.25rem; letter-spacing: -0.01em; }

/* Große Übersichtskarten oben */
dl {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(12.5rem, 1fr));
  gap: 1rem;
  margin: 1.35rem 0;
}
dl > div {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 0.75rem;
  padding: 1.05rem 1.25rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  box-shadow: 0 2px 5px rgba(15, 23, 42, .03);
  transition: transform .15s ease, box-shadow .15s ease;
}
dl > div:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 14px rgba(15, 23, 42, .06);
}
.tot-ico {
  width: 2.3rem;
  height: 2.3rem;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 0.55rem;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}
.tot-ico .ico { width: 1.55rem; height: 1.55rem; }
dt { color: var(--muted); font-size: .84rem; font-weight: 500; }
dd { margin: 0.15rem 0 0; font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; }

/* Klickbare Spieler-Leiste */
.players-bar {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  flex-wrap: wrap;
  margin: 0 0 1.4rem;
}
.players-bar .lbl {
  font-size: .9rem;
  font-weight: 500;
  color: var(--muted);
  margin-right: 0.25rem;
}
.p-chip {
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 2rem;
  padding: 0.4rem 0.95rem 0.4rem 0.5rem;
  font: inherit;
  font-size: .95rem;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  box-shadow: 0 1px 2px rgba(0,0,0,.02);
  transition: background .15s ease, border-color .15s ease, transform .12s ease, box-shadow .15s ease;
}
.p-chip:hover {
  background: var(--accent-soft);
  border-color: var(--accent);
  color: var(--accent);
  box-shadow: 0 3px 8px rgba(29, 91, 191, .1);
}
.p-chip:active { transform: scale(.97); }

/* Hauptbereich (Kategorien, Suche & Tabelle) */
.panel {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: 0.85rem;
  padding: 1.25rem 1.5rem 1.6rem;
  box-shadow: 0 2px 6px rgba(15, 23, 42, .03);
}
.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 1rem;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
  margin-bottom: 0.85rem;
}
.tabs {
  display: flex;
  flex-wrap: wrap;
  gap: 0.3rem 1.25rem;
}
.tabs button {
  background: none;
  border: 0;
  border-bottom: 3px solid transparent;
  color: var(--muted);
  font: inherit;
  font-size: 1rem;
  font-weight: 500;
  padding: 0.6rem 0.15rem;
  margin-bottom: -1px;
  cursor: pointer;
  white-space: nowrap;
  transition: color .15s ease, border-color .15s ease;
}
.tabs button:hover { color: var(--text); }
.tabs button[aria-pressed="true"] {
  color: var(--accent);
  border-color: var(--accent);
  font-weight: 600;
}
.search-input {
  width: 17rem;
  max-width: 100%;
  font: inherit;
  font-size: .95rem;
  color: inherit;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 0.5rem;
  padding: 0.5rem 0.85rem;
  margin-bottom: 0.55rem;
  transition: border-color .15s ease, background .15s ease, box-shadow .15s ease;
}
.search-input:focus {
  background: var(--surface);
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
  outline: none;
}

table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th {
  text-align: left;
  font-weight: 600;
  font-size: .82rem;
  text-transform: uppercase;
  letter-spacing: .04em;
  color: var(--muted);
  padding: 0.65rem 0.75rem;
  border-bottom: 1px solid var(--line);
}
td {
  padding: 0.75rem 0.75rem;
  border-bottom: 1px solid var(--line);
  font-size: 1.02rem;
  vertical-align: middle;
}
tbody tr:last-child td { border-bottom: 0; }
tbody tr { transition: background .12s ease; }
tbody tr:hover { background: var(--bg); }
.num { text-align: right; white-space: nowrap; font-weight: 600; }
th.num { text-align: right; }

.link {
  background: none;
  border: 0;
  padding: 0.15rem 0;
  font: inherit;
  font-weight: 500;
  color: var(--accent);
  cursor: pointer;
  text-align: left;
  display: inline-flex;
  align-items: center;
  gap: 0.7rem;
}
.link:hover span { text-decoration: underline; }
.plink {
  background: none;
  border: 0;
  padding: 0.15rem 0;
  font: inherit;
  font-weight: 500;
  color: var(--text);
  cursor: pointer;
  text-align: left;
  display: inline-flex;
  align-items: center;
  gap: 0.55rem;
  transition: color .12s ease;
}
.plink:hover { color: var(--accent); }
.plink:hover span { text-decoration: underline; }

.lead-cell {
  display: inline-flex;
  align-items: center;
  gap: 0.6rem;
}
.lead-val {
  color: var(--muted);
  font-size: .88rem;
  font-weight: 400;
}

/* Icons & Spielerköpfe (Nearest-Neighbour, skaliert mit Bildschirm) */
.ico {
  width: 1.45rem;
  height: 1.45rem;
  object-fit: contain;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  flex-shrink: 0;
  pointer-events: none;
}
.head {
  width: 1.55rem;
  height: 1.55rem;
  border-radius: 0.22rem;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  flex-shrink: 0;
  background: var(--soft);
}
.empty { color: var(--muted); padding: 2rem 0.75rem; text-align: center; }

/* Dezente Animationen für Tabellenwechsel & Fenster */
@keyframes fadeInRows {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}
.anim-list tr { animation: fadeInRows .16s ease-out both; }

dialog {
  width: min(48rem, calc(100vw - 2rem));
  max-height: 86vh;
  overflow: auto;
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 0.9rem;
  padding: 1.5rem 1.75rem;
  box-shadow: 0 24px 54px rgba(15, 23, 42, .18);
}
dialog[open] {
  animation: dlgOpen .22s cubic-bezier(.16, 1, .3, 1) forwards;
}
dialog::backdrop {
  background: rgba(15, 23, 42, .4);
  backdrop-filter: blur(3px);
  animation: backdropFade .2s ease forwards;
}
@keyframes dlgOpen {
  from { opacity: 0; transform: translateY(12px) scale(.97); }
  to { opacity: 1; transform: translateY(0) scale(1); }
}
@keyframes backdropFade {
  from { opacity: 0; }
  to { opacity: 1; }
}

.dh {
  display: flex;
  justify-content: space-between;
  gap: 1rem;
  align-items: center;
  position: sticky;
  top: -1.5rem;
  background: var(--surface);
  padding: 0.25rem 0 0.9rem;
  border-bottom: 1px solid var(--line);
  z-index: 2;
}
.dh h2 {
  font-size: 1.35rem;
  font-weight: 700;
  margin: 0;
  display: flex;
  align-items: center;
  gap: 0.65rem;
}
.dh h2 .ico { width: 1.75rem; height: 1.75rem; }
.dh h2 .head { width: 1.85rem; height: 1.85rem; }
.dh button {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 0.45rem;
  color: inherit;
  font: inherit;
  font-size: .92rem;
  font-weight: 500;
  padding: 0.4rem 0.9rem;
  cursor: pointer;
  transition: background .15s ease, border-color .15s ease;
}
.dh button:hover { background: var(--soft); border-color: #cfd5e0; }

/* Tribüne für Plätze 1-3 */
.podium {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 0.85rem;
  align-items: end;
  margin: 1.2rem 0 1.4rem;
  padding: 1.25rem 1rem 0;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 0.75rem;
}
.pod-slot {
  display: flex;
  flex-direction: column;
  align-items: center;
  text-align: center;
}
.pod-player {
  background: none;
  border: 0;
  padding: 0.3rem;
  font: inherit;
  color: var(--text);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.4rem;
  transition: transform .15s ease, color .15s ease;
}
.pod-player:hover { transform: translateY(-3px); color: var(--accent); }
.pod-player .head {
  width: 2.8rem;
  height: 2.8rem;
  border-radius: 0.3rem;
  box-shadow: 0 3px 8px rgba(0,0,0,.12);
}
.pod-1 .pod-player .head {
  width: 3.5rem;
  height: 3.5rem;
}
.pod-name {
  font-weight: 600;
  font-size: 1rem;
  max-width: 10rem;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pod-val {
  font-size: .88rem;
  font-weight: 500;
  color: var(--muted);
  margin-bottom: 0.55rem;
  font-variant-numeric: tabular-nums;
}
.pod-bar {
  width: 100%;
  border-radius: 0.5rem 0.5rem 0 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 1.1rem;
  border: 1px solid transparent;
  border-bottom: 0;
}
.pod-1 .pod-bar { height: 4.6rem; background: var(--gold-bg); color: var(--gold); border-color: #fde68a; font-size: 1.3rem; }
.pod-2 .pod-bar { height: 3.4rem; background: var(--silver-bg); color: var(--silver); border-color: #d1d5db; }
.pod-3 .pod-bar { height: 2.5rem; background: var(--bronze-bg); color: var(--bronze); border-color: #fed7aa; }

/* Rang-Badges hinter den Stats im Spielerfenster */
.rank-badge {
  display: inline-block;
  min-width: 2.4rem;
  text-align: center;
  font-size: .85rem;
  font-weight: 700;
  padding: 0.2rem 0.55rem;
  border-radius: 1rem;
  background: var(--soft);
  color: var(--muted);
}
.rank-1 { background: var(--gold-bg); color: var(--gold); }
.rank-2 { background: var(--silver-bg); color: var(--silver); }
.rank-3 { background: var(--bronze-bg); color: var(--bronze); }

.share {
  display: inline-block;
  width: 5.5rem;
  height: 0.45rem;
  border-radius: 0.25rem;
  overflow: hidden;
  background: var(--soft);
  vertical-align: middle;
  margin-left: 0.6rem;
}
.share i { display: block; height: 100%; background: var(--accent); border-radius: 0.25rem; }

/* Mobile Optimierungen */
@media (max-width: 720px) {
  .wrap { width: 100%; padding: 0 0.9rem 3rem; }
  h1 { font-size: 1.45rem; margin-top: 1.1rem; }
  dl { grid-template-columns: repeat(2, 1fr); gap: 0.65rem; }
  dl > div { padding: 0.8rem 0.9rem; gap: 0.7rem; }
  .tot-ico { width: 2rem; height: 2rem; }
  dd { font-size: 1.25rem; }
  .panel { padding: 0.9rem; }
  .toolbar { flex-direction: column; align-items: stretch; gap: 0.65rem; }
  .tabs {
    flex-wrap: nowrap;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding-bottom: 2px;
  }
  .tabs::-webkit-scrollbar { display: none; }
  .search-input { width: 100%; margin-bottom: 0.6rem; }
  .col-lead, .share { display: none; }
  dialog {
    width: 100%;
    max-width: 100%;
    max-height: 90vh;
    margin: auto 0 0 0;
    border-radius: 1rem 1rem 0 0;
    padding: 1.15rem 1rem 1.5rem;
  }
  .podium { gap: 0.4rem; padding: 0.85rem 0.5rem 0; }
  .pod-name { max-width: 5.8rem; font-size: .85rem; }
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <nav><a href="index.html">Forever Dudde</a><a href="stats.html" aria-current="page">Statistiken</a></nav>
    <span class="muted" id="upd"></span>
  </header>
  <h1>Server-Statistiken</h1>
  <p class="muted">Summe aller Spieler. Statistik oder Spieler anklicken, um Details und Platzierungen zu sehen.</p>
  <dl id="tot"></dl>
  <div class="players-bar" id="pbar" aria-label="Spieler auswählen"></div>

  <div class="panel">
    <div class="toolbar">
      <nav class="tabs" id="tabs" aria-label="Kategorien"></nav>
      <input id="q" class="search-input" type="search" placeholder="Statistik suchen …" aria-label="Statistik suchen">
    </div>
    <table>
      <thead>
        <tr>
          <th>Statistik</th>
          <th class="col-lead">Platz 1</th>
          <th class="num">Gesamt</th>
        </tr>
      </thead>
      <tbody id="list" class="anim-list"></tbody>
    </table>
  </div>
</div>

<!-- Dialog 1: Statistik-Rangliste mit Tribüne (Plätze 1-3) -->
<dialog id="dlg">
  <div class="dh"><h2 id="dt"></h2><button id="x" type="button">Schließen</button></div>
  <p class="muted" id="ds" style="margin:0.65rem 0 0.8rem"></p>
  <div id="podium" class="podium"></div>
  <table>
    <thead><tr><th>#</th><th>Spieler</th><th class="num">Wert</th><th class="num">Anteil</th></tr></thead>
    <tbody id="db"></tbody>
  </table>
</dialog>

<!-- Dialog 2: Einzelspieler-Statistiken mit Rang-Anzeige -->
<dialog id="pdlg">
  <div class="dh"><h2 id="pdt"></h2><button id="px" type="button">Schließen</button></div>
  <p class="muted" id="pds" style="margin:0.65rem 0 0.8rem"></p>
  <div class="toolbar" style="margin-bottom:0.65rem">
    <nav class="tabs" id="ptabs" aria-label="Spieler-Kategorien"></nav>
    <input id="pq" class="search-input" type="search" placeholder="Im Spielerprofil suchen …" aria-label="Spieler-Statistik suchen">
  </div>
  <table>
    <thead><tr><th>Statistik</th><th class="num">Wert</th><th class="num">Platzierung</th></tr></thead>
    <tbody id="pdb" class="anim-list"></tbody>
  </table>
</dialog>

  mined:{"minecraft:stone":mk([21000,9000,15000,3000,40000]),"minecraft:diamond_ore":mk([140,60,0,22,310]),"minecraft:oak_log":mk([900,2200,400,1500,1300])},
